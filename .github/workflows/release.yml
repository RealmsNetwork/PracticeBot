name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match pom.xml), without the v prefix"
        required: true
        default: "1.8.6"
        type: string

permissions:
  contents: write

concurrency:
  group: practicebot-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create or validate release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          POM_VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("pom.xml").getroot(); print(root.findtext("{http://maven.apache.org/POM/4.0.0}version", ""))')"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must be dispatched from main."
              exit 1
            fi

            VERSION="${INPUT_VERSION}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must use numeric MAJOR.MINOR.PATCH format, for example 1.8.0."
              exit 1
            fi

            if [[ "${POM_VERSION}" != "${VERSION}" ]]; then
              echo "::error::Requested version ${VERSION} does not match pom.xml version ${POM_VERSION}."
              exit 1
            fi

            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists. Use the tag push workflow or choose a new project version."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "PracticeBot ${TAG}"
            git push origin "refs/tags/${TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Invalid release tag: ${TAG}"
              exit 1
            fi

            VERSION="${TAG#v}"
            if [[ "${POM_VERSION}" != "${VERSION}" ]]; then
              echo "::error::Tag ${TAG} does not match pom.xml version ${POM_VERSION}."
              exit 1
            fi

            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::Release tags must point to a commit reachable from main."
              exit 1
            fi
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: mvn -B clean test package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: PracticeBot-${{ steps.release.outputs.tag }}
          path: target/PracticeBot-*.jar
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" target/PracticeBot-*.jar \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" target/PracticeBot-*.jar \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PracticeBot ${TAG}" \
              --generate-notes
          fi
