config-version: 3
# ==========================================================
#  PracticeBot - Configuration
#  Author: THEMPGUY
# ==========================================================

# ----------------------------------------------------------
#  DEFAULT SETTINGS
# ----------------------------------------------------------
default:
  # Bot health in hearts (20.0 = 10 hearts like a player)
  bot-health: 20.0

  # Whether bots can be pushed by entities
  collidable: true

  # Make bots completely invulnerable to damage
  bot-invulnerable: false

  # Allow players to spawn multiple bots at once
  allow-multiple-bots: false

  # Prefix for bot names (shown above their head)
  # Plain text only - color codes are NOT supported in nameplates
  # Total name (prefix + player name) is capped at 16 characters
  # Example: "[BOT] " or "Bot_"
  bot-prefix: ""

  # Despawn the bot when it kills its owner
  # true = bot despawns when it kills owner (default)
  # false = bot stays spawned after killing owner
  despawn-on-owner-death: true

  # List of worlds where bot spawning is disabled
  # Players cannot spawn bots in these worlds
  disabled-worlds:
    - "example_world"
    # Add more worlds as needed


# ----------------------------------------------------------
#  BEHAVIOUR DEFAULTS
#  Default settings when a bot is spawned
# ----------------------------------------------------------
default-behaviour:
  # Bot looks at owner when nearby
  look-at-owner: true

  # Bot follows owner around
  follow-owner: false

  # Bot walks randomly when idle
  random-walk: false

  # Bot holds a shield (visual only)
  hold-shield: false

  # Bot actively uses shield to block attacks
  use-shield: false

  # Bot attacks players in range
  pvp-enabled: false


# ----------------------------------------------------------
#  CRYSTAL PVP BOT SETTINGS
# ----------------------------------------------------------
cpvp:
  # Default settings when a CPVP bot is spawned
  # These are applied when a new CPVP bot is created
  defaults:
    # Starting skill level: EASY, MEDIUM, HARD, or PRO
    skill-level: MEDIUM

    # How aggressive the bot is (0.5 - 2.0)
    # Higher = more aggressive crystal placement/breaking
    aggression-weight: 1.3

    # Whether bot uses ender pearls for mobility
    use-pearls: true

    # Whether bot uses mace for aerial attacks
    use-mace: false

    # Whether bot eats golden apples to heal
    use-golden-apples: false

    # Whether bot places obsidian for crystal bases
    place-obsidian: true

    # Whether bot may directly break soft wall/path blocks when they are
    # actually blocking CPvP pressure or line of approach to the target.
    break-blocks: false

    # Whether bot strafes during combat
    strafing-enabled: true

    # Whether CPvP bots may use glowstone + respawn anchors when
    # they score better than crystals in close or defensive fights.
    anchoring-mode: false

    # Health percentage to start healing (0.2 - 0.8)
    heal-threshold: 0.4

    # Minimum HP that must remain after a survivable low-health crystal.
    # 0.05 keeps spam active below 2 hearts while still rejecting lethal crystals.
    low-hp-crystal-lethal-reserve: 0.05

    # Pearl cooldown in milliseconds (500 - 3000)
    pearl-cooldown-ms: 1800

    # Horizontal combat field of view in degrees.
    # 100 = realistic forward combat awareness.
    # 360 = full awareness.
    # Lower values require the bot to be facing the action before it can place,
    # break crystals, place obsidian, or use anchors.
    fov-degrees: 120.0

  # ----------------------------------------
  # DIFFICULTY LEVELS
  # Admins can customize all values below
  # You can also add custom difficulty levels!
  # ----------------------------------------
  difficulty-levels:
    EASY:
      # Combat weight
      aggression-weight: 0.7
      # Dynamic crystal timing range (milliseconds)
      place-delay-min-ms: 220
      place-delay-max-ms: 320
      break-delay-min-ms: 130
      break-delay-max-ms: 190
      sword-delay-ms: 800
      # Human-like realism: lower difficulties do not punish every frame-perfect window.
      reaction-hesitation-chance-percent: 35
      reaction-hesitation-min-ms: 180
      reaction-hesitation-max-ms: 380
      crystal-miss-chance-percent: 18
      crystal-miss-min-ms: 160
      crystal-miss-max-ms: 360
      non-urgent-pearl-restraint-chance-percent: 45

    MEDIUM:
      aggression-weight: 1.3
      place-delay-min-ms: 120
      place-delay-max-ms: 190
      break-delay-min-ms: 80
      break-delay-max-ms: 135
      sword-delay-ms: 600
      reaction-hesitation-chance-percent: 14
      reaction-hesitation-min-ms: 70
      reaction-hesitation-max-ms: 160
      crystal-miss-chance-percent: 7
      crystal-miss-min-ms: 90
      crystal-miss-max-ms: 210
      non-urgent-pearl-restraint-chance-percent: 18

    HARD:
      aggression-weight: 1.5
      place-delay-min-ms: 15
      place-delay-max-ms: 35
      break-delay-min-ms: 13
      break-delay-max-ms: 45
      sword-delay-ms: 500
      reaction-hesitation-chance-percent: 4
      reaction-hesitation-min-ms: 20
      reaction-hesitation-max-ms: 55
      crystal-miss-chance-percent: 2
      crystal-miss-min-ms: 40
      crystal-miss-max-ms: 90
      non-urgent-pearl-restraint-chance-percent: 5

    PRO:
      aggression-weight: 2.0
      place-delay-min-ms: 3
      place-delay-max-ms: 14
      break-delay-min-ms: 2
      break-delay-max-ms: 18
      sword-delay-ms: 500
      reaction-hesitation-chance-percent: 0
      reaction-hesitation-min-ms: 0
      reaction-hesitation-max-ms: 0
      crystal-miss-chance-percent: 0
      crystal-miss-min-ms: 0
      crystal-miss-max-ms: 0
      non-urgent-pearl-restraint-chance-percent: 0

    # ----------------------------------------
    # CUSTOM DIFFICULTY EXAMPLE (uncomment to use)
    # ----------------------------------------
    # GODLIKE:
    #   aggression-weight: 2.5
    #   place-delay-min-ms: 1
    #   place-delay-max-ms: 8
    #   break-delay-min-ms: 1
    #   break-delay-max-ms: 10
    #   sword-delay-ms: 400
    #   reaction-hesitation-chance-percent: 0
    #   reaction-hesitation-min-ms: 0
    #   reaction-hesitation-max-ms: 0
    #   crystal-miss-chance-percent: 0
    #   crystal-miss-min-ms: 0
    #   crystal-miss-max-ms: 0
    #   non-urgent-pearl-restraint-chance-percent: 0


  # ----------------------------------------
  # PERFORMANCE
  # Safe adaptive throttling for large CPVP bot stress tests.
  # Existing configs do not need to be deleted; missing values use these defaults.
  # This only throttles non-urgent expensive scans. Active crystal/anchor actions stay immediate.
  # ----------------------------------------
  performance:
    adaptive-enabled: true
    low-bot-threshold: 10
    medium-bot-threshold: 20
    high-bot-threshold: 35
    low-scan-period-ticks: 3
    medium-scan-period-ticks: 4
    high-scan-period-ticks: 6
    anchor-count-cache-ticks: 3
    crystal-search-cache-ticks: 2
    navigation-retarget-ms: 250
    high-load-navigation-retarget-ms: 1200

  # ----------------------------------------
#  TICK / AI SETTINGS
# ----------------------------------------------------------
ai:
  # How often bot AI updates (in ticks, 1 = every tick)
  # Lower = more responsive, Higher = better performance
  tick-interval: 1

  # Maximum distance bot can walk from spawn point when random walking
  random-walk-radius: 6.0


# ----------------------------------------------------------
#  PVP SETTINGS
# ----------------------------------------------------------
pvp:
  # Base attack cooldown in milliseconds (without crits)
  base-cooldown-ms: 500

  # Cooldown when using critical hits (by crit speed setting)
  crit-cooldowns:
    slow: 550      # More careful, harder hits
    normal: 440    # Balanced timing
    fast: 340      # Aggressive rapid crits

  # Cooldown multipliers for aggression levels
  # Higher value = slower attacks for that aggression level
  aggression-cooldown-multipliers:
    low: 1.5       # 50% slower (more defensive)
    medium: 1.2    # 20% slower (balanced)
    high: 1.0      # Normal speed (aggressive)

  # Damage multipliers based on aggression level
  # To enable: Add getter methods to ConfigManager.java
  aggression-damage-modifiers:
    low: 1.0       # Normal damage
    medium: 1.05   # 5% more damage
    high: 1.1      # 10% more damage

  # Critical hit damage multiplier (Minecraft default is 1.5)
  crit-multiplier: 1.5

  # Reach distances in blocks for different reach modes
  reach-distances:
    short: 2.0      # Conservative reach
    normal: 3.0     # Vanilla Minecraft reach
    extended: 3.5   # Slightly extended
    advanced: 4.0   # Maximum reach

  # Chase/navigation speed for different aggression levels
  chase-speeds:
    low: 1.0        # Normal walking speed
    medium: 1.2     # 20% faster
    high: 1.4       # 40% faster

  # ----------------------------------------
  # KNOCKBACK SETTINGS
  # ----------------------------------------
  knockback:
    # Base horizontal knockback multiplier
    horizontal: 0.4

    # Base vertical knockback multiplier
    vertical: 0.36

    # W-tap knockback multiplier
    wtap-multiplier: 1.0

    # Additional knockback bonus when w-tapping
    wtap-bonus: 0.3

  # ----------------------------------------
  # STRAFE SETTINGS (combat strafe)
  # Applied when in active combat with target
  # ----------------------------------------
  strafe:
    # Strafe movement speed (blocks per tick)
    speeds:
      low: 0.16       # Slow, predictable
      medium: 0.20    # Balanced
      high: 0.24      # Fast, hard to hit

    # How often bot changes strafe direction (milliseconds)
    switch-intervals:
      low: 800        # Slow direction changes
      medium: 550     # Moderate changes
      high: 350       # Rapid direction changes

  # ----------------------------------------
  # APPROACH STRAFE SETTINGS
  # Applied when bot is closing distance to target
  # ----------------------------------------
  approach-strafe:
    # Approach strafe speed
    speeds:
      low: 0.10
      medium: 0.13
      high: 0.16

    # Direction change interval while approaching
    switch-intervals:
      low: 700
      medium: 500
      high: 350

    # Chase speed while approaching target
    chase-speeds:
      low: 0.16
      medium: 0.20
      high: 0.24


# ----------------------------------------------------------
#  MODERN WEAPON AI
# ----------------------------------------------------------
modern-weapons:
  mace:
    # Native Minecraft smash damage is fall-distance based.
    # The bot tries to create a safe launch window before dropping.
    wind-charge-enabled: true
    wind-charge-launch-height: 7.0
    assisted-jump-without-wind-charge: true
    launch-min-distance: 2.8
    launch-max-distance: 4.5

  spear:
    # Java 1.21.11+ Spear supports Jab and a kinetic Charge.
    charge-enabled: true
    charge-delay-ms: 400
    contact-cooldown-ms: 500
    min-relative-speed-bps: 4.6
    # Vanilla kinetic_weapon damage uses floor(relative_speed * multiplier).
    # Kept configurable because the public Bukkit 1.21.1 API cannot expose the
    # 1.21.11 per-material item-component constant directly.
    charge-velocity-multiplier: 1.0

# ----------------------------------------------------------
#  TACTICAL / HUMANIZATION SETTINGS
# ----------------------------------------------------------
tactics:
  humanization:
    # Different bots get independent simulated latency profiles.
    movement-enabled: true
    movement-jitter: 0.015
    strafe-switch-ms: 380

    ping:
      min-ms: 35
      max-ms: 180
      jitter-ms: 8
      action-latency-fraction: 0.35

    reaction:
      min-ms: 85.0
      max-ms: 210.0

    aim:
      max-degrees-per-update: 24.0
      jitter-degrees: 0.6

    attack:
      min-delay-ms: 8.0
      max-delay-ms: 42.0

    # Small intentional human mistakes keep the bot from behaving like a
    # deterministic combat macro.
    mistake-chance-percent: 3.0
    mistake-delay-min-ms: 55
    mistake-delay-max-ms: 180

  wind-charge-reset:
    enabled: true
    local-fallback: true
    # Matches the common Paper Wind Charge Reset behavior: falling,
    # looking sufficiently downward, preserve horizontal momentum, clear Y.
    min-fall-distance: 2.25
    max-upward-velocity: -0.55
    max-target-distance: 18.0
    cooldown-ms: 650
    plugin-pitch: 82.0

  elytra:
    enabled: true
    start-min-distance: 9.0
    start-max-distance: 28.0
    launch-y: 0.58
    flight-window-ms: 4200
    rocket-interval-ms: 650
    dive-distance: 4.25
    mace-dive-y: -1.45
    spear-dive-y: -0.85
    mace-min-smash-fall: 2.0

  attribute-swap:
    # Only turns on automatically when Paper reports
    # unsupported-settings.update-equipment-on-player-actions=false.
    enabled: false
    chance-percent: 10.0

  pearl:
    enabled: true
    low-health-threshold: 0.35
    min-distance: 2.5
    max-distance: 12.0
    cooldown-ms: 7000
    chance-percent: 45.0

  fast-crystals:
    # auto = detect FastCrystals by plugin name and adapt PracticeBot timing.
    # force-on/force-off are useful for custom forks.
    mode: auto
    remove-artificial-delay: true
    timing-scale: 0.80

  cart-pvp:
    enabled: true
    cooldown-ms: 3500
    min-distance: 5.0
    max-distance: 18.0
    launch-speed: 0.8
    fuse-ticks: 45
    rail-search-radius: 6

# ----------------------------------------------------------
#  SHIELD SYSTEM
# ----------------------------------------------------------
shield:
  # How long shield is disabled after axe break (milliseconds)
  # Vanilla Minecraft = 5000ms (5 seconds)
  stun-duration-ms: 5000

  # Angle in degrees where shield can block attacks
  # 180 = front hemisphere, 360 = all directions
  block-angle: 180.0

  # Delay before bot raises shield after detecting threat (ms)
  block-delay-ms: 100


# ----------------------------------------------------------
#  COMMAND SETTINGS
# ----------------------------------------------------------
commands:
  # Permission required for admin commands
  # (/pb reload, /pb inventory, /pb egui)
  admin-permission: "practicebot.admin"

  # Generic permission that grants access to spawn any bot type
  # Individual permissions: practicebot.spawn.normal, practicebot.spawn.cpvp
  spawnbot-permission: "practicebot.spawn"


# ----------------------------------------------------------
#  GUI SETTINGS
# ----------------------------------------------------------
gui:
  # GUI inventory titles
  # Supports all color formats: &a, &#RRGGBB, rgb:R,G,B
  # Example: "&#FF5555Custom Title" or "&6Bot Settings"
  settings-title: "Practice Bot Settings"
  pvp-settings-title: "Bot PvP Settings"
  bot-inventory-title: "Bot Inventory"
  default-inventory-title: "Default Bot Inventory"

  # Sound effects for GUI interactions
  # Use Minecraft sound names (e.g., BLOCK_NOTE_BLOCK_PLING)
  sounds:
    open: "BLOCK_CHEST_OPEN"
    close: "BLOCK_CHEST_CLOSE"
    click: "UI_BUTTON_CLICK"


# ----------------------------------------------------------
#  DEBUG OPTIONS
# ----------------------------------------------------------
debug:
  # Print detailed AI behavior to console
  verbose-ai: false

  # Print detailed PvP mechanics to console
  verbose-pvp: false


# ----------------------------------------------------------
#  LICENSE
# ----------------------------------------------------------
license:
  # You can set this from console/in-game with:
  # /pbadmin license set XXXX-XXXX-XXXX-XXXX
  code: ""
