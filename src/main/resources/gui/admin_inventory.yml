# ==========================================================
#  ADMIN INVENTORY DATA STORAGE
#  
#  Note: The actual trim configurations are stored in
#  /plugins/PracticeBot/default_inv.yml
#  
#  This file only controls the GUI appearance.
#  
#  Data stored in default_inv.yml:
#  - armor-type: netherite/diamond
#  - leggings-enchant: protection/blast_protection
#  - leggings-material: netherite/diamond
#  - offhand-type: totem/shield
#  - totem-amount: 1-64
#  - helmet-trim-pattern: trim pattern key
#  - helmet-trim-material: trim material key
#  - (same for chest, legs, boots)
# ==========================================================
