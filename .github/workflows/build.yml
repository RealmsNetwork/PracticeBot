name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean test package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PracticeBot-${{ github.sha }}
          path: target/PracticeBot-*.jar
          if-no-files-found: error
